name: Daily Website Health & Domain Shift Checker

on:
  schedule:
    # Runs daily at 03:00 UTC (08:30 AM IST)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  check-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run daily site health & domain migration check
        run: node scripts/daily-health-check.mjs --update-sources

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "FreeWebStuff Health Bot"
          git add public/data/site-health.json lib/db/allCategorySections.json components/categories/CategoryView.tsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update website health & domain shifts [skip ci]" && git push)
