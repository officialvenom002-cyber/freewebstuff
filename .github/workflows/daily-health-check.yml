name: Autonomous Vault Sync & Dead-Site Pruner

on:
  schedule:
    # Runs automatically everyday at 03:00 UTC (08:30 AM IST)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

jobs:
  vault-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run Full Auto-Sync & Dead-Site Pruning Pipeline
        run: node scripts/auto-sync-and-prune.mjs --all

      - name: Commit and push verified updates (Zero Vercel Load)
        run: |
          git config --local user.email "bot@freewebstuff.site"
          git config --local user.name "FreeWebStuff Vault Engine"
          git add public/data/ lib/db/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(vault): auto-sync verified tools & prune dead links [skip ci]" && git push)
